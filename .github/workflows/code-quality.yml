name: Code quality

on:
  pull_request:
  push:
    branches:
      - redesign/step-7-homepage-skeleton
  workflow_dispatch:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Check source lint
        run: yarn lint
      - name: Build production bundle
        run: yarn vite build
